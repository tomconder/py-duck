[project]
name = "py-duck"
version = "0.1.0"
description = "Hello world"
readme = "README.md"
authors = [
    { name = "Tom Conder", email = "tom@itstom.co" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = ["E", "W", "I", "B", "UP", "SIM", "RUF", "PL", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D102"]
